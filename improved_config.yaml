# Improved Configuration for Better Generalization
# This configuration reduces overfitting by:
# - Using smaller network (less parameters to memorize)
# - Increasing dropout (more regularization)
# - Stronger L2 regularization
# - Earlier stopping

physics_model:
  k: 0.13                    # Degradation coefficient
  temperature_ref: 25.0      # Reference temperature (°C)

ml_model:
  # Smaller network architecture to reduce overfitting
  hidden_layers: [32, 16]    # Reduced from [64, 64]
  dropout_rate: 0.3          # Increased from 0.1 for better regularization
  activation: "relu"
  output_activation: null
  
  # Training parameters
  learning_rate: 0.0005      # Slightly reduced for more stable training
  batch_size: 64             # Increased from 32 for better gradient estimates
  epochs: 100
  validation_split: 0.2
  
  # Stronger regularization
  l1_regularization: 0.0
  l2_regularization: 0.01    # Increased from 0.001
  
  # Earlier stopping to prevent overfitting
  early_stopping_patience: 5  # Reduced from 10
  reduce_lr_patience: 3       # Reduced from 5
  
  # Optimization
  optimizer: "adam"
  loss_function: "mse"

data:
  validation_split: 0.2
  random_state: 42
  batch_size: 1000
  
  # Data quality
  outlier_threshold: 3.0
  missing_value_strategy: "interpolate"
  
  # Feature engineering
  add_derived_features: true
  normalize_features: true

training:
  # Cross-validation
  cv_folds: 5
  cv_scoring: "neg_mean_squared_error"
  
  # Model selection
  model_selection_metric: "val_rmse"

evaluation:
  metrics:
    - "rmse"
    - "mae"
    - "r2"
    - "mape"
    - "max_error"
  
  confidence_level: 0.95
  bootstrap_samples: 1000

logging:
  level: "INFO"
  format: "structured"
  file_logging: false

reproducibility:
  random_seed: 42
  deterministic: true
